name: docs

# PS-231 — this file used to re-implement the org's `rtd-sphinx-build`
# reusable instead of calling it. It now calls it, and keeps ONLY the two
# behaviours the reusable does not provide (see the `bundle` job).
#
# WHY BOTH JOBS EXIST, rather than one or the other. The reusable was read
# before this was written, not assumed to be a superset: it builds
# `<confdir>` to `<confdir>/_build/html` and stops. It has no `-W` input and
# no notion of the in-wheel docs bundle. Deleting the local job to reach a
# clean audit would have silently dropped both — a green audit bought with a
# stale packaged bundle and warnings that no longer fail PRs.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # The shared gate: the org's workflow, called not copied.
  sphinx:
    # Skip when HEAD is the bot's own previous docs auto-commit — breaks
    # the infinite loop without using `[skip ci]`, which would also
    # suppress the tag-push and release workflows when the auto-commit
    # is the most recent commit on develop at release time.
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main

  # Genuinely local, and genuinely not a copy of the reusable:
  #   1. `-W` on pull_request, so a NEW sphinx warning fails the PR. The
  #      reusable builds without it, so this is the only thing keeping
  #      warnings from accumulating unnoticed.
  #   2. Refreshing `src/scitex_plt/_sphinx_html/` — the docs bundle that
  #      ships INSIDE the wheel. Nothing in the reusable knows that
  #      directory exists; without this the packaged copy drifts from the
  #      source and nobody finds out until a reader opens stale HTML.
  bundle:
    needs: sphinx
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML (warnings fail PRs only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html
          else
            sphinx-build -b html docs/sphinx docs/sphinx/_build/html
          fi

      - name: Refresh src/scitex_plt/_sphinx_html/ (develop push only)
        # main is PR-only — its _sphinx_html/ bundle arrives via the
        # develop -> main PR. Direct bot-pushes to main are inhibited
        # so the branch history stays linear-via-PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          rm -rf src/scitex_plt/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex_plt/_sphinx_html
          touch src/scitex_plt/_sphinx_html/.nojekyll

      - name: Commit refreshed HTML if it changed (develop push only)
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          if [ -n "$(git status --porcelain src/scitex_plt/_sphinx_html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/scitex_plt/_sphinx_html
            git commit -m "docs(sphinx_html): refresh from CI build"
            git push
          fi
