name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `secrets: inherit` (PS-224). This caller fires on
    # `issue_comment` and `pull_request_target`, both of which an
    # unauthenticated outsider can trigger on a public repo, so `inherit`
    # would forward every secret this repository holds into a job a
    # stranger caused to run. Pass ONLY the one secret the callee declares
    # (`GH_PERSONAL_ACCESS_TOKEN`, required).
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}