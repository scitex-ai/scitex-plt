codecov:
  require_ci_to_pass: false
  branch: develop

coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

ignore:
  - "src/scitex_plt/_sphinx_html/**"
  - "src/scitex_plt/_skills/**"
  - "tests/**"
  - "examples/**"

comment: false
